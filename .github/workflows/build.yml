name: Validate Flutter Mobile App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  validate:
    name: Format, analyze & test (fail-closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies (lockfile must not change)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # Debug APK for device testing. Release builds fail on purpose until an
  # upload keystore is configured (see README), so this is NOT a store build.
  build-android-debug:
    name: Debug APK (main only, not for store)
    needs: [validate, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Label and checksum
        run: |
          name="${APP_SLUG}-${GITHUB_SHA::7}-debug-NOT-FOR-STORE.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS)
          {
            echo "### Debug APK (CI build, not for store)"
            echo ""
            echo "\`$name\` sha256 \`$(cut -d' ' -f1 dist/SHA256SUMS)\`"
            echo ""
            echo "Commit \`$GITHUB_SHA\`, Flutter $FLUTTER_VERSION. Debug-signed: for device testing only."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          APP_SLUG: coursenotes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coursenotes-debug-apk-NOT-FOR-STORE
          path: dist/
          if-no-files-found: error
          retention-days: 14

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@493a7f5c322219e61245cf17f1fa34de2c35a22b # v1.6.6
